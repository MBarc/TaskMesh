name: taskmesh

services:
  postgres:
    image: postgres:16-alpine
    container_name: taskmesh-postgres
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      - taskmesh-network

  ollama:
    build:
      context: ollama
      dockerfile: Dockerfile
      args:
        - OLLAMA_MODEL=${OLLAMA_MODEL}
    container_name: taskmesh-ollama
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    deploy:
      resources:
        limits:
          memory: 4G
    networks:
      - taskmesh-network

  ai-service:
    build:
      context: ../ai-service
      dockerfile: Dockerfile
    container_name: taskmesh-ai-service
    restart: unless-stopped
    depends_on:
      - ollama
    volumes:
      - uploads:/app/uploads
    environment:
      - OLLAMA_HOST=${OLLAMA_HOST}
      - OLLAMA_MODEL=${OLLAMA_MODEL}
      - WHISPER_MODEL=${WHISPER_MODEL}
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - taskmesh-network

  server:
    build:
      context: ../server
      dockerfile: Dockerfile
    container_name: taskmesh-server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      ai-service:
        condition: service_started
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - AI_SERVICE_URL=${AI_SERVICE_URL}
      - PORT=${PORT}
      - DOCUMENTATION_PATH=${DOCUMENTATION_PATH}
    volumes:
      - uploads:/app/uploads
      - ${DOCUMENTATION_PATH:-../documentation}:/documentation
      - ../sample-documentation:/sample-documentation
    ports:
      - "${SERVER_PORT:-4000}:4000"
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      - taskmesh-network

  client:
    build:
      context: ../client
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=${VITE_API_URL}
    container_name: taskmesh-client
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "${CLIENT_PORT:-3000}:80"
    deploy:
      resources:
        limits:
          memory: 128M
    networks:
      - taskmesh-network

volumes:
  postgres_data:
  ollama_data:
  uploads:

networks:
  taskmesh-network:
    driver: bridge
