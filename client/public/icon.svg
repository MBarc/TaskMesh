<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <g transform="translate(5, 5)">
    <!-- Grid dots -->
    <circle cx="20" cy="20" r="5" fill="#6366f1"/>
    <circle cx="50" cy="20" r="5" fill="#6366f1"/>
    <circle cx="80" cy="20" r="5" fill="#6366f1"/>
    <circle cx="20" cy="50" r="5" fill="#818cf8"/>
    <circle cx="50" cy="50" r="5" fill="#818cf8"/>
    <circle cx="80" cy="50" r="5" fill="#818cf8"/>
    <circle cx="20" cy="80" r="5" fill="#a5b4fc"/>
    <circle cx="50" cy="80" r="5" fill="#a5b4fc"/>
    <circle cx="80" cy="80" r="5" fill="#a5b4fc"/>
    <!-- Horizontal lines -->
    <line x1="25" y1="20" x2="45" y2="20" stroke="#6366f1" stroke-width="2" opacity="0.6"/>
    <line x1="55" y1="20" x2="75" y2="20" stroke="#6366f1" stroke-width="2" opacity="0.6"/>
    <line x1="25" y1="50" x2="45" y2="50" stroke="#818cf8" stroke-width="2" opacity="0.6"/>
    <line x1="55" y1="50" x2="75" y2="50" stroke="#818cf8" stroke-width="2" opacity="0.6"/>
    <line x1="25" y1="80" x2="45" y2="80" stroke="#a5b4fc" stroke-width="2" opacity="0.6"/>
    <line x1="55" y1="80" x2="75" y2="80" stroke="#a5b4fc" stroke-width="2" opacity="0.6"/>
    <!-- Vertical lines -->
    <line x1="20" y1="25" x2="20" y2="45" stroke="#6366f1" stroke-width="2" opacity="0.4"/>
    <line x1="50" y1="25" x2="50" y2="45" stroke="#6366f1" stroke-width="2" opacity="0.4"/>
    <line x1="80" y1="25" x2="80" y2="45" stroke="#6366f1" stroke-width="2" opacity="0.4"/>
    <line x1="20" y1="55" x2="20" y2="75" stroke="#818cf8" stroke-width="2" opacity="0.4"/>
    <line x1="50" y1="55" x2="50" y2="75" stroke="#818cf8" stroke-width="2" opacity="0.4"/>
    <line x1="80" y1="55" x2="80" y2="75" stroke="#818cf8" stroke-width="2" opacity="0.4"/>
    <!-- Diagonal connections -->
    <line x1="25" y1="25" x2="45" y2="45" stroke="#6366f1" stroke-width="1.5" opacity="0.3"/>
    <line x1="55" y1="25" x2="75" y2="45" stroke="#6366f1" stroke-width="1.5" opacity="0.3"/>
    <line x1="25" y1="55" x2="45" y2="75" stroke="#818cf8" stroke-width="1.5" opacity="0.3"/>
  </g>
</svg>
